
name: Build Mangayomi AppImage

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-appimage:
    runs-on: ubuntu-24.04

    env:
      CFLAGS: "-march=x86-64-v2"
      CXXFLAGS: "-march=x86-64-v2"
      RUSTFLAGS: "-C target-cpu=x86-64-v2"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            webkit2gtk-4.1 clang cmake ninja-build pkg-config \
            libgtk-3-dev mpv libmpv-dev \
            libjpeg-dev libpng-dev libavif-dev libsecret-1-dev

          sudo wget -O /usr/local/bin/linuxdeploy \
            https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          sudo chmod +x /usr/local/bin/linuxdeploy

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Get dependencies
        run: flutter pub get

      - name: Build Linux
        run: flutter build linux --release

      - name: Create AppImage
        run: |
          set -euo pipefail

          BUNDLE="build/linux/x64/release/bundle"

          rm -rf AppDir
          mkdir -p AppDir/usr/bin AppDir/usr/share/icons

          cp -a "$BUNDLE/." AppDir/usr/bin/
          cp -rL linux/packaging/icons/* AppDir/usr/share/icons/

          # mpv library symlink
          if [ ! -e AppDir/usr/bin/lib/libmpv.so ]; then
            mkdir -p AppDir/usr/lib
            ln -s libmpv.so.2 AppDir/usr/lib/libmpv.so
          fi

          # Bundle libavif and its dependencies (used through dlopen)
          avif="$(ldconfig -p | awk '/libavif\.so\.16 /{print $NF; exit}')"

          if [ -n "$avif" ]; then
            copy_avif() {
              local lib="$1" base
              base="$(basename "$lib")"

              [ -e "AppDir/usr/bin/lib/$base" ] && return 0

              case "$base" in
                libc.so*|libm.so*|libdl.so*|libpthread.so*|librt.so*|libresolv.so*|libgcc_s.so*|libstdc++.so*|ld-linux*)
                  return 0 ;;
              esac

              cp -L "$lib" "AppDir/usr/bin/lib/$base"

              while read -r dep; do
                case "$dep" in
                  /*) copy_avif "$dep" ;;
                esac
              done < <(ldd "$lib" 2>/dev/null | awk '/=> \//{print $3}')
            }

            copy_avif "$avif"
          fi

          # Exclude libraries already bundled with the application
          exclude_args=()
          while IFS= read -r lib; do
            exclude_args+=(--exclude-library "$lib")
          done < <(find AppDir/usr/bin/lib -type f -name "*.so*" -printf '%f\n' | sort -u)

          cp linux/mangayomi.desktop AppDir/mangayomi.desktop

          # AppRun launcher
          cat <<'EOF' > AppDir/AppRun
          #!/bin/sh
          SELF=$(readlink -f "$0")
          HERE=${SELF%/*}
          export PATH="${HERE}/usr/bin/:${PATH}"
          export LD_LIBRARY_PATH="${HERE}/usr/bin/lib/:${HERE}/usr/lib/:${LD_LIBRARY_PATH}"
          exec "${HERE}/usr/bin/mangayomi" "$@"
          EOF

          chmod +x AppDir/AppRun

          # Build AppImage
          export APPIMAGE_EXTRACT_AND_RUN=1

          /usr/local/bin/linuxdeploy \
            --appdir AppDir \
            --desktop-file AppDir/mangayomi.desktop \
            --icon-file AppDir/usr/share/icons/hicolor/512x512/apps/mangayomi.png \
            --executable AppDir/usr/bin/mangayomi \
            "${exclude_args[@]}" \
            --output appimage

          APPIMAGE="$(find . -maxdepth 1 -type f -name '*.AppImage' -print -quit)"
          test -n "$APPIMAGE"

          mkdir -p dist
          mv "$APPIMAGE" "dist/Mangayomi-${GITHUB_REF_NAME}-linux-x86_64.AppImage"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Mangayomi-${{ github.ref_name }}-AppImage
          path: dist/*.AppImage
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.AppImage
          generate_release_notes: true
