name: Build & Release AppImage (x86-64 Baseline)

on:
  workflow_dispatch:
  push:
    tags:
      - v*

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  build-appimage-x86-64:
    permissions:
      contents: write
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            webkit2gtk-4.1 clang cmake ninja-build pkg-config libgtk-3-dev \
            mpv libmpv-dev dpkg-dev libblkid-dev liblzma-dev fuse rpm \
            libjpeg-dev libpng-dev libavif-dev libsecret-1-dev
          wget -O /usr/local/bin/linuxdeploy \
            "https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage"
          chmod +x /usr/local/bin/linuxdeploy

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Flutter pub get
        run: flutter pub get

      - name: Build Linux (targeting baseline x86-64)
        env:
          CFLAGS: "-march=x86-64 -mtune=generic"
          CXXFLAGS: "-march=x86-64 -mtune=generic"
          RUSTFLAGS: "-C target-cpu=x86-64"
        run: flutter build linux --release --verbose

      - name: Verify ISA level of the executable and bundled libs
        run: |
          BIN=build/linux/x64/release/bundle/mangayomi
          if [ ! -f "$BIN" ]; then
            echo "Error: Main executable not found at $BIN"
            exit 1
          fi
          readelf --notes --wide "$BIN" | grep -i "ISA needed" || echo "Baseline x86-64 confirmed."
          if readelf --notes --wide build/linux/x64/release/bundle/mangayomi build/linux/x64/release/bundle/lib/*.so 2>/dev/null | grep -q "x86-64-v[3-9]"; then
            echo "FAIL: A binary or bundled .so requires x86-64-v3 or higher."
            exit 1
          fi
          echo "SUCCESS: All binaries are compatible with baseline x86-64."

      - name: Create AppImage
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: |
          rm -rf AppDir
          mkdir -p AppDir/usr/bin
          mkdir -p AppDir/usr/share/icons
          cp -r build/linux/x64/release/bundle/* AppDir/usr/bin/
          cp -rL linux/packaging/icons/* AppDir/usr/share/icons

          if [ ! -e AppDir/usr/bin/lib/libmpv.so ]; then
            mkdir -p AppDir/usr/lib
            ln -s libmpv.so.2 AppDir/usr/lib/libmpv.so
          fi

          avif="$(ldconfig -p | awk '/libavif\.so/{print $NF; exit}')"
          if [ -n "$avif" ]; then
            copy_avif() {
              local lib="$1" base
              base="$(basename "$lib")"
              [ -e "AppDir/usr/bin/lib/$base" ] && return 0
              case "$base" in
                libc.so*|libm.so*|libdl.so*|libpthread.so*|librt.so*|libresolv.so*|libgcc_s.so*|libstdc++.so*|ld-linux*) return 0 ;;
              esac
              cp -L "$lib" "AppDir/usr/bin/lib/$base"
              while read -r dep; do
                case "$dep" in /*) copy_avif "$dep" ;; esac
              done < <(ldd "$lib" 2>/dev/null | awk '/=> \//{print $3}')
            }
            copy_avif "$avif"
          fi

          EXCLUDE_ARGS=""
          for lib in $(find AppDir/usr/bin/lib -type f -name "*.so*" -exec basename {} \; | sort -u); do
            EXCLUDE_ARGS+=" --exclude-library $lib"
          done

          cp linux/mangayomi.desktop AppDir/mangayomi.desktop
          printf '#!/bin/sh\nSELF=$(readlink -f "$0")\nHERE=${SELF%%/*}\nexport PATH="${HERE}/usr/bin/:${PATH}"\nexport LD_LIBRARY_PATH="${HERE}/usr/bin/lib/:${HERE}/usr/lib/:${LD_LIBRARY_PATH}"\nexec "${HERE}/usr/bin/mangayomi" "$@"\n' > AppDir/AppRun
          chmod +x AppDir/AppRun

          /usr/local/bin/linuxdeploy \
            --appdir AppDir \
            --desktop-file AppDir/mangayomi.desktop \
            --icon-file AppDir/usr/share/icons/hicolor/512x512/apps/mangayomi.png \
            --executable AppDir/usr/bin/mangayomi \
            $EXCLUDE_ARGS \
            --output appimage

          mv ./*.AppImage build/linux/x64/release/Mangayomi-${{ github.ref_name }}-linux-x86_64.AppImage

      - name: Upload AppImage artifact
        uses: actions/upload-artifact@v4
        with:
          name: Mangayomi-${{ github.ref_name }}-linux-x86_64-AppImage
          path: build/linux/x64/release/Mangayomi-*.AppImage
          if-no-files-found: error
